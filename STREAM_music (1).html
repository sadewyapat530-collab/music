<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAM</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ════════════════════════════════
   ROOT & RESET
════════════════════════════════ */
:root {
  --accent: rgba(255,255,255,0.92);
  --accent-dim: rgba(255,255,255,0.55);
  --accent-glow: rgba(255,255,255,0.12);
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.20);
  --muted: rgba(255,255,255,0.40);
  --text: #f0f0f0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  background:#000;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
}

/* ════════════════════════════════
   SPLASH SCREEN
════════════════════════════════ */
#splash{
  position:fixed;inset:0;
  background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9999;
  gap:1.2rem;
}

.splash-icon{
  width:72px;height:72px;
  border:2px solid rgba(255,255,255,0.25);
  border-radius:22px;
  display:grid;place-items:center;
  font-size:1.8rem;
  color:#fff;
  opacity:0;
  transform:scale(0.5) rotate(-15deg);
  animation: splashIcon 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
  box-shadow:0 0 40px rgba(255,255,255,0.08);
}

.splash-name{
  font-family:'Syne',sans-serif;
  font-size:3.2rem;
  font-weight:900;
  letter-spacing:-0.04em;
  color:#fff;
  opacity:0;
  transform:translateY(16px);
  animation: splashText 0.6s ease 0.55s forwards;
}

.splash-tagline{
  font-size:0.85rem;
  color:var(--muted);
  letter-spacing:0.18em;
  text-transform:uppercase;
  opacity:0;
  animation: splashText 0.5s ease 0.85s forwards;
}

.splash-bar{
  width:120px;height:2px;
  background:var(--border2);
  border-radius:2px;
  overflow:hidden;
  margin-top:0.5rem;
  opacity:0;
  animation: splashText 0.4s ease 1s forwards;
}

.splash-bar-fill{
  height:100%;
  background:#fff;
  width:0;
  border-radius:2px;
  animation: barFill 1.1s ease 1.1s forwards;
}

@keyframes splashIcon{
  to{opacity:1;transform:scale(1) rotate(0deg);}
}
@keyframes splashText{
  to{opacity:1;transform:translateY(0);}
}
@keyframes barFill{
  to{width:100%;}
}

/* fade out whole splash */
#splash.hide{
  animation: splashFade 0.55s ease forwards;
}
@keyframes splashFade{
  to{opacity:0;pointer-events:none;}
}

/* ════════════════════════════════
   MAIN APP (hidden until splash done)
════════════════════════════════ */
#app{
  opacity:0;
  transition:opacity 0.5s ease;
}
#app.visible{opacity:1;}

/* subtle bg glow */
#app::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 5%, rgba(255,255,255,0.03) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(255,255,255,0.02) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  max-width:1360px;
  margin:0 auto;
  padding:0 1.4rem 6rem;
  position:relative;
  z-index:1;
}

/* ════════════════════════════════
   SEARCH ISLAND (only header)
════════════════════════════════ */
.island-header{
  position:sticky;
  top:0.9rem;
  z-index:100;
  display:flex;
  justify-content:center;
  padding-top:1rem;
  margin-bottom:2.2rem;
}

.search-island{
  width:min(660px,100%);
  background:rgba(0,0,0,0.62);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--border2);
  border-radius:50px;
  display:flex;
  align-items:center;
  padding:0.35rem 0.35rem 0.35rem 1.3rem;
  gap:0.5rem;
  box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 8px 40px rgba(0,0,0,0.75);
  animation:islandDrop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  transition:border-color 0.3s,box-shadow 0.3s;
}

.search-island:focus-within{
  border-color:rgba(255,255,255,0.4);
  box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 8px 40px rgba(0,0,0,0.75), 0 0 28px rgba(255,255,255,0.06);
}

.search-island input{
  flex:1;
  background:transparent;
  border:none;outline:none;
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:1rem;
  font-weight:400;
  min-width:0;
}

.search-island input::placeholder{color:var(--muted);}

.s-btn{
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:50px;
  padding:0.55rem 1.2rem;
  color:#fff;
  font-family:'Syne',sans-serif;
  font-size:0.82rem;
  font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;gap:0.4rem;
  transition:background 0.2s,border-color 0.2s,box-shadow 0.2s;
  white-space:nowrap;
  letter-spacing:0.02em;
}

.s-btn.s-badge{
  padding:0.55rem 0.7rem;
  font-size:0.9rem;
  border-radius:50%;
  aspect-ratio:1;
  min-width:0;
}

.s-btn:hover{
  background:rgba(255,255,255,0.18);
  border-color:rgba(255,255,255,0.35);
  box-shadow:0 0 14px rgba(255,255,255,0.08);
}

@keyframes islandDrop{
  from{opacity:0;transform:scale(0.9) translateY(-12px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}

/* ════════════════════════════════
   STATUS BAR
════════════════════════════════ */
.status-bar{
  text-align:center;
  color:var(--muted);
  font-size:0.8rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  margin-bottom:1.4rem;
  min-height:1.1em;
}

/* ════════════════════════════════
   VIDEO GRID
════════════════════════════════ */
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
  gap:1rem;
}

.video-card{
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:transform 0.22s,box-shadow 0.22s,border-color 0.22s;
  animation:cardIn 0.35s ease both;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

.video-card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,0.28);
  box-shadow:0 14px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
}

.thumb-wrap{
  position:relative;
  height:148px;
  overflow:hidden;
}

.thumb-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  transition:transform 0.4s;
}

.video-card:hover .thumb-wrap img{transform:scale(1.06);}

.thumb-overlay{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:rgba(0,0,0,0);
  transition:background 0.22s;
}

.video-card:hover .thumb-overlay{background:rgba(0,0,0,0.42);}

.play-btn{
  width:44px;height:44px;
  background:rgba(255,255,255,0.92);
  border-radius:50%;
  display:grid;place-items:center;
  color:#000;
  font-size:0.9rem;
  opacity:0;
  transform:scale(0.65);
  transition:opacity 0.22s,transform 0.22s;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

.video-card:hover .play-btn{opacity:1;transform:scale(1);}

.dur-badge{
  position:absolute;bottom:7px;right:7px;
  background:rgba(0,0,0,0.80);
  backdrop-filter:blur(6px);
  padding:2px 7px;border-radius:5px;
  font-size:0.72rem;font-weight:500;
  letter-spacing:0.03em;
}

.card-info{padding:0.85rem;}

.card-title{
  font-family:'Syne',sans-serif;
  font-weight:600;font-size:0.86rem;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:0.4rem;
}

.card-channel{
  font-size:0.76rem;
  color:var(--muted);
  margin-bottom:0.3rem;
  display:flex;align-items:center;gap:5px;
}

.card-channel::before{
  content:'';
  width:5px;height:5px;
  background:rgba(255,255,255,0.35);
  border-radius:50%;
  flex-shrink:0;
}

.card-stats{
  display:flex;gap:0.75rem;
  font-size:0.72rem;
  color:var(--muted);
}

.card-stats span{display:flex;align-items:center;gap:3px;}

/* ════════════════════════════════
   LOADING / WELCOME
════════════════════════════════ */
.loading-msg{
  grid-column:1/-1;
  text-align:center;
  padding:5rem 2rem;
  color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:1rem;
  font-size:0.9rem;
}

.spinner{
  width:34px;height:34px;
  border:2px solid var(--border2);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.75s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg);}}

.welcome{
  grid-column:1/-1;
  text-align:center;
  padding:6rem 2rem;
  color:var(--muted);
}

.welcome i{
  font-size:2.5rem;display:block;
  margin-bottom:1rem;opacity:0.2;
}

.welcome p{line-height:1.7;font-size:0.95rem;}

/* ════════════════════════════════
   PLAYER DYNAMIC ISLAND
════════════════════════════════ */
.player-island-wrap{
  position:fixed;
  bottom:1.2rem;left:50%;
  transform:translateX(-50%) translateY(130px);
  width:min(860px,calc(100vw - 1.6rem));
  z-index:200;
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

.player-island-wrap.active{
  transform:translateX(-50%) translateY(0);
}

.player-island{
  background:rgba(10,10,10,0.78);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--border2);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,0.04), 0 24px 80px rgba(0,0,0,0.88), 0 0 50px rgba(255,255,255,0.04);
}

/* pill row */
.player-pill{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.55rem 0.6rem 0.55rem 0.9rem;
  cursor:pointer;
  user-select:none;
}

.pill-thumb{
  width:38px;height:38px;
  border-radius:9px;
  object-fit:cover;
  flex-shrink:0;
  border:1px solid var(--border);
}

.pill-info{flex:1;min-width:0;}

.pill-title{
  font-family:'Syne',sans-serif;
  font-size:0.82rem;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.pill-sub{font-size:0.7rem;color:var(--muted);}

.pill-actions{display:flex;align-items:center;gap:0.35rem;}

.pill-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:50px;
  color:#fff;
  padding:0.32rem 0.7rem;
  font-size:0.72rem;
  cursor:pointer;
  display:flex;align-items:center;gap:0.28rem;
  transition:background 0.18s,border-color 0.18s;
  font-family:'DM Sans',sans-serif;
  white-space:nowrap;
}

.pill-btn:hover{background:rgba(255,255,255,0.13);border-color:rgba(255,255,255,0.32);}

.pill-close{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:50%;
  width:28px;height:28px;
  display:grid;place-items:center;
  color:var(--muted);
  cursor:pointer;
  font-size:0.72rem;
  flex-shrink:0;
  transition:background 0.18s,color 0.18s;
}

.pill-close:hover{background:rgba(255,255,255,0.14);color:#fff;}

/* expanded */
.player-expanded{display:none;}
.player-island-wrap.expanded .player-expanded{display:block;}
.player-island-wrap.expanded .player-pill{border-bottom:1px solid var(--border);}

.player-iframe-wrap{
  position:relative;
  padding-bottom:56.25%;
  height:0;
}

.player-iframe-wrap .plyr{position:absolute;inset:0;height:100%;--plyr-color-main:#fff;--plyr-video-background:#000;font-family:'DM Sans',sans-serif;}
.player-iframe-wrap .plyr__video-embed iframe{pointer-events:none;}
.player-iframe-wrap.audio-only{background:center/cover no-repeat var(--ao-thumb,#000);}
.player-iframe-wrap.audio-only::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(18px);}
.player-iframe-wrap.audio-only .plyr__video-wrapper{opacity:0;}
.player-iframe-wrap.audio-only .plyr{z-index:1;background:transparent;}
.action-btn.on{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);}
.player-iframe-wrap iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:none;
}



.player-actions-bar{
  padding:0.8rem 1rem;
  display:flex;align-items:center;gap:0.5rem;
  flex-wrap:wrap;
  border-top:1px solid var(--border);
}

.player-actions-bar .label{
  font-size:0.76rem;color:var(--muted);margin-right:0.1rem;
}

/* ════════════════════════════════
   ACTION BUTTONS
════════════════════════════════ */
.action-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:50px;
  color:#fff;
  padding:0.4rem 0.9rem;
  font-size:0.76rem;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:0.32rem;
  transition:background 0.18s,border-color 0.18s;
  font-family:'DM Sans',sans-serif;
  white-space:nowrap;
}

.action-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.30);}

.action-btn.primary{
  background:rgba(255,255,255,0.12);
  border-color:rgba(255,255,255,0.30);
}

.action-btn.primary:hover{background:rgba(255,255,255,0.20);border-color:rgba(255,255,255,0.45);}

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
.toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%);
  background:rgba(18,18,18,0.95);
  backdrop-filter:blur(20px);
  border:1px solid var(--border2);
  border-radius:50px;
  padding:0.55rem 1.4rem;
  font-size:0.82rem;
  color:#fff;
  z-index:500;
  opacity:0;pointer-events:none;
  transition:opacity 0.28s;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
  white-space:nowrap;
}

.toast.show{opacity:1;}

/* ════════════════════════════════
   RESPONSIVE
════════════════════════════════ */
@media(max-width:600px){
  .video-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:0.7rem;}
  .thumb-wrap{height:105px;}
  .card-info{padding:0.6rem;}
  .player-island-wrap{bottom:0.7rem;}
  .pill-btn .btn-label{display:none;}
  .wrap{padding:0 0.8rem 5rem;}
}
.welcome .site-logo{display:block;margin:0 auto 1rem;width:72px;height:72px;opacity:0.25;}
</style>

<!-- ══════════════ SPLASH ══════════════ -->
<div id="splash">
  <div class="splash-icon"><i class="fas fa-music"></i></div>
  <div class="splash-name">STREAM</div>
  <div class="splash-tagline">Your music. Your way.</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<!-- ══════════════ MAIN APP ══════════════ -->
<div id="app">
  <div class="wrap">

    <!-- Search island only — no logo -->
    <div class="island-header">
      <div class="search-island">
        <input id="q" type="text" placeholder="Search music, or paste a YouTube URL…" autocomplete="off">

          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="video-grid" id="grid">

        <svg class="site-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="STREAM logo">

        <p>Search music or paste a video link.<br>Click a video to start playing.</p>
      </div>
    </div>

  </div><!-- /wrap -->
</div><!-- /app -->

<!-- ══════════════ PLAYER ISLAND ══════════════ -->
<div class="player-island-wrap" id="playerWrap">
  <div class="player-island">

    <!-- pill -->
    <div class="player-pill" id="pillToggle">
      <img class="pill-thumb" id="pillThumb" src="" alt="">
      <div class="pill-info">
        <div class="pill-title" id="pillTitle">Now Playing</div>
        <div class="pill-sub" id="pillSub">STREAM</div>
      </div>
      <div class="pill-actions">
        <button class="pill-btn" id="expandBtn" onclick="event.stopPropagation()">
          <i class="fas fa-chevron-up" id="expandIcon"></i>
          <span class="btn-label">Expand</span>
        </button>
        <button class="pill-close" id="closePlayer" onclick="event.stopPropagation()">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- expanded -->
    <div class="player-expanded" id="playerExpanded">
      <div class="player-iframe-wrap">
        <div id="plyrHost"></div>
      </div>
      <div class="player-actions-bar">
        <button class="action-btn" id="audioBtn"><i class="fas fa-headphones"></i> Audio</button>
      </div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────
   CONFIG
───────────────────────────── */
const API_KEY = 'AIzaSyAAKsfv-VHU80bOi6H9DJmzWB-gQ6TLsYc';

/* ─────────────────────────────
   SPLASH → APP
───────────────────────────── */
// total splash animation time ≈ 2.2s (bar fill ends at 2.2s)
window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.getElementById('splash');
    const app    = document.getElementById('app');
    splash.classList.add('hide');
    setTimeout(() => {
      splash.style.display = 'none';
      app.classList.add('visible');
    }, 560);
  }, 2300);
});

/* ─────────────────────────────
   ELEMENTS
───────────────────────────── */
const qInput      = document.getElementById('q');
const searchBtn   = document.getElementById('searchBtn');
const grid        = document.getElementById('grid');
const statusBar   = document.getElementById('statusBar');
const playerWrap  = document.getElementById('playerWrap');
const plyrHost    = document.getElementById('plyrHost');
const iframeWrap  = document.querySelector('.player-iframe-wrap');
let player = null, lastSave = 0;
const pillTitle   = document.getElementById('pillTitle');
const pillSub     = document.getElementById('pillSub');
const pillThumb   = document.getElementById('pillThumb');
const expandBtn   = document.getElementById('expandBtn');
const expandIcon  = document.getElementById('expandIcon');
const closePlayer = document.getElementById('closePlayer');
const toast       = document.getElementById('toast');

let currentVideoId = '';
let currentTitle   = '';
let currentThumb   = '';
let isExpanded     = false;

/* ─────────────────────────────
   SEARCH
───────────────────────────── */
searchBtn.addEventListener('click', doSearch);
qInput.addEventListener('keypress', e => e.key === 'Enter' && doSearch());

function extractYouTubeId(str) {
  // Match full URLs or short youtu.be links
  const patterns = [
    /(?:youtube\.com\/watch\?.*v=|youtu\.be\/)([A-Za-z0-9_-]{11})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/
  ];
  for (const p of patterns) {
    const m = str.match(p);
    if (m) return m[1];
  }
  return null;
}

function doSearch() {
  const q = qInput.value.trim();
  if (!q) { showToast('Type something to search'); return; }

  // Check if user pasted a YouTube URL
  const ytId = extractYouTubeId(q);
  if (ytId) {
    // Fetch info for that specific video then play it
    statusBar.textContent = 'Loading video…';
    fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${ytId}&key=${API_KEY}`)
      .then(r => r.json())
      .then(data => {
        if (!data.items?.length) {
          // Can't fetch info but still play it
          openPlayer(ytId, 'YouTube Video', '', `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`);
          statusBar.textContent = '';
          return;
        }
        const v = data.items[0];
        const s = v.snippet;
        const thumb = s.thumbnails?.medium?.url || `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
        statusBar.textContent = '';
        openPlayer(ytId, s.title, s.channelTitle, thumb);
      })
      .catch(() => {
        openPlayer(ytId, 'YouTube Video', '', `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`);
        statusBar.textContent = '';
      });
    return;
  }

  grid.innerHTML = `<div class="loading-msg"><div class="spinner"></div>Searching…</div>`;
  statusBar.textContent = '';

  fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(q)}&type=video&key=${API_KEY}`)
    .then(r => r.json())
    .then(data => {
      if (!data.items?.length) {
        grid.innerHTML = `<div class="loading-msg">No results found.</div>`;
        return;
      }
      const ids = data.items.map(v => v.id.videoId).join(',');
      return fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${ids}&key=${API_KEY}`)
        .then(r => r.json())
        .then(d => renderVideos(d.items || data.items, q));
    })
    .catch(() => {
      grid.innerHTML = `<div class="loading-msg">Error fetching results. Check your API key.</div>`;
    });
}

function renderVideos(videos, query) {
  statusBar.textContent = `${videos.length} results · "${query}"`;
  grid.innerHTML = '';

  videos.forEach((v, i) => {
    const id    = v.id?.videoId || v.id;
    const s     = v.snippet;
    const stats = v.statistics;
    const thumb = s.thumbnails?.medium?.url || s.thumbnails?.default?.url || '';
    const dur   = v.contentDetails?.duration ? fmtDur(v.contentDetails.duration) : '';
    const views = stats?.viewCount ? fmtNum(stats.viewCount) + ' views' : '';
    const likes = stats?.likeCount ? fmtNum(stats.likeCount) : '';

    const el = document.createElement('div');
    el.className = 'video-card';
    el.style.animationDelay = `${i * 0.035}s`;
    el.innerHTML = `
      <div class="thumb-wrap">
        <img src="${thumb}" alt="${esc(s.title)}" loading="lazy">
        <div class="thumb-overlay">
          <div class="play-btn"><i class="fas fa-play" style="margin-left:2px"></i></div>
        </div>
        ${dur ? `<span class="dur-badge">${dur}</span>` : ''}
      </div>
      <div class="card-info">
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-channel">${esc(s.channelTitle)}</div>
        <div class="card-stats">
          ${views ? `<span><i class="fas fa-eye"></i> ${views}</span>` : ''}
          ${likes ? `<span><i class="fas fa-thumbs-up"></i> ${likes}</span>` : ''}
        </div>
      </div>
    `;
    el.addEventListener('click', () => openPlayer(id, s.title, s.channelTitle, thumb));
    grid.appendChild(el);
  });
}

/* ─────────────────────────────
   PLAYER
───────────────────────────── */
function openPlayer(id, title, channel, thumb) {
  currentVideoId = id;
  currentTitle   = title;
  currentThumb   = thumb;

  loadVideo(id, title, channel, thumb);
  pillTitle.textContent = title;
  pillSub.textContent   = channel;
  pillThumb.src         = thumb;

  playerWrap.classList.add('active');
  if (!isExpanded) expandPlayer();
}

/* ── Plyr player ── */
function initPlayer() {
  plyrHost.setAttribute('data-plyr-provider','youtube');
  plyrHost.setAttribute('data-plyr-embed-id', currentVideoId);
  player = new Plyr(plyrHost, {
    autoplay: true,
    controls: ['play-large','rewind','play','fast-forward','progress','current-time','duration','mute','volume','settings','fullscreen'],
    settings: ['quality','speed','loop'],
    speed: { selected: 1, options: [0.5,0.75,1,1.25,1.5,2] },
    seekTime: 10, keyboard: { focused: true, global: true },
    clickToPlay: true, hideControls: true, resetOnEnd: true,
    youtube: { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1, controls: 0, disablekb: 1, playsinline: 1, fs: 0, cc_load_policy: 0 }
  });
  // resume where the viewer left off
  player.on('ready', () => {
    const t = parseFloat(localStorage.getItem('pos_' + currentVideoId) || 0);
    if (t > 5) player.currentTime = t;
  });
  player.on('timeupdate', () => {
    const now = Date.now();
    if (now - lastSave > 3000 && player.currentTime) {
      lastSave = now;
      try { localStorage.setItem('pos_' + currentVideoId, player.currentTime); } catch(e){}
    }
  });
  player.on('ended', () => { try { localStorage.removeItem('pos_' + currentVideoId); } catch(e){} });
  player.on('playing', () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
  player.on('pause',   () => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });
}

function loadVideo(id, title, channel, thumb) {
  iframeWrap.style.setProperty('--ao-thumb', `url(${thumb})`);
  if (!player) { initPlayer(); }
  else {
    player.source = { type:'video', sources:[{ src:id, provider:'youtube' }] };
    player.once('ready', () => player.play());
  }
  setMediaSession(title, channel, thumb);
}

/* Lock-screen / notification controls */
function setMediaSession(title, channel, thumb) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title, artist: channel || 'STREAM', artwork: [{ src: thumb, sizes: '320x180', type: 'image/jpeg' }] });
  navigator.mediaSession.setActionHandler('play',  () => player && player.play());
  navigator.mediaSession.setActionHandler('pause', () => player && player.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => player && player.rewind(10));
  navigator.mediaSession.setActionHandler('seekforward',  () => player && player.forward(10));
}

/* Audio-only mode */
document.getElementById('audioBtn').addEventListener('click', e => {
  const on = iframeWrap.classList.toggle('audio-only');
  e.currentTarget.classList.toggle('on', on);
});

function expandPlayer() {
  isExpanded = true;
  playerWrap.classList.add('expanded');
  expandIcon.className = 'fas fa-chevron-down';
  const lbl = expandBtn.querySelector('.btn-label');
  if (lbl) lbl.textContent = 'Collapse';
}

function collapsePlayer() {
  isExpanded = false;
  playerWrap.classList.remove('expanded');
  expandIcon.className = 'fas fa-chevron-up';
  const lbl = expandBtn.querySelector('.btn-label');
  if (lbl) lbl.textContent = 'Expand';
}

expandBtn.addEventListener('click', () => isExpanded ? collapsePlayer() : expandPlayer());
document.getElementById('pillToggle').addEventListener('click', () => isExpanded ? collapsePlayer() : expandPlayer());


closePlayer.addEventListener('click', () => {
  playerWrap.classList.remove('active','expanded');
  isExpanded = false;
  if (player) player.stop();
  iframeWrap.classList.remove('audio-only');
  document.getElementById('audioBtn').classList.remove('on');
});


/* ─────────────────────────────
   TOAST
───────────────────────────── */
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ─────────────────────────────
   HELPERS
───────────────────────────── */
function fmtDur(iso) {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  const h = +(m[1]||0), mn = +(m[2]||0), s = +(m[3]||0);
  return h
    ? `${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${mn}:${String(s).padStart(2,'0')}`;
}

function fmtNum(n) {
  return Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sanitizeName(name) {
  return name.replace(/[^\w\s\-]/g,'').replace(/\s+/g,'_').slice(0,80);
}
